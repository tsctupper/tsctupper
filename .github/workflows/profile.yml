name: Profile README

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR updates share a group. Each main run has its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the profile README exists and has content
        run: test -s README.md && grep -q '[^[:space:]]' README.md

      - name: Check Markdown links, files and heading anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ''
          args: --no-progress --include-fragments --exclude-all-private --max-retries 3 README.md
